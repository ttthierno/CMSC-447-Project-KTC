name: ktc
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ktc
      POSTGRES_USER: ktc_owner
      POSTGRES_PASSWORD: ${KTC_DB_PASSWORD:?Set KTC_DB_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:${KTC_DB_PORT:-55432}:5432"
    volumes:
      - ktc_data:/var/lib/postgresql/data
      - ./001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./002_access_and_workflows.sql:/docker-entrypoint-initdb.d/002_access_and_workflows.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktc_owner -d ktc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ktc_data:
